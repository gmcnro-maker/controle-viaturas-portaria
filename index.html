  <script>
/**
 * CEP4 Enterprise UI - camada de apresentação não invasiva.
 * Mantém autenticação, regras de autorização, envio de fotos e backend existentes.
 * Deve ser carregado após todos os scripts clássicos, antes do módulo auth.js.
 */
(() => {
  'use strict';
  const previousRender = render;
  const zone = 'America/Porto_Velho';
  const dayFormat = new Intl.DateTimeFormat('pt-BR', {timeZone:zone,day:'2-digit',month:'2-digit',year:'numeric'});
  const iconPaths = {
    garage:'M4 21V9l8-6 8 6v12M4 10h16M8 21v-7h8v7M8 17h8',
    route:'M4 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM20 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM4 18V9a5 5 0 0 1 5-5h9M10 20h4a6 6 0 0 0 6-6V6',
    wrench:'M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a5 5 0 0 0 6.4-6.4L14 12l-2-2 2.7-3.7Z',
    registry:'M8 4h11v16H5V7l3-3Zm0 0v3H5m4 4h7m-7 4h7',
    exit:'M5 12h14m-6-6 6 6-6 6',
    return:'M19 12H5m6-6-6 6 6 6',
    check:'m5 12 4 4L19 6'
  };
  const icon = (name) => '<svg class="ep-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+iconPaths[name]+'"/></svg>';
  const safe = (v) => String(v == null ? '' : v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const numberValue = v => Number.isFinite(Number(v)) ? Number(v).toLocaleString('pt-BR') : '—';
  function day(value){if(!value)return '';const date=new Date(value);return Number.isFinite(date.getTime())?dayFormat.format(date):'';}
  function metrics(){
    const fleet=Array.isArray(state?.vehicles)?state.vehicles:[];
    const trips=Array.isArray(state?.trips)?state.trips:[];
    const occupied=new Set(trips.filter(t=>t.status!=='Concluída').map(t=>t.vehicleId));
    const garage=fleet.filter(v=>(v.status||'Ativa')==='Ativa'&&!v.busy&&!occupied.has(v.id)).length;
    const transit=trips.filter(t=>['Em serviço','Aguardando entrada'].includes(t.status)).length;
    const maintenance=fleet.filter(v=>v.status==='Manutenção').length;
    const current=dayFormat.format(new Date());
    const today=trips.filter(t=>[t.createdAt,t.exitAt,t.returnAt,t.entryAt].some(x=>day(x)===current)).length;
    return [
      {name:'Viaturas na garagem',value:garage,icon:'garage',tone:'blue',hint:'Ativas sem movimentação aberta*'},
      {name:'Em trânsito',value:transit,icon:'route',tone:'amber',hint:'Saídas autorizadas, entradas pendentes'},
      {name:'Manutenção',value:maintenance,icon:'wrench',tone:'violet',hint:'Viaturas indisponíveis'},
      {name:'Registros do dia',value:today,icon:'registry',tone:'green',hint:'Movimentações com evento hoje'}
    ];
  }
  function metricMarkup(items,compact=false){
    return items.map(x=>'<article class="ep-kpi '+safe(x.tone)+'" aria-label="'+safe(x.name)+': '+x.value+'"><div class="ep-kpi-row"><span>'+safe(x.name)+'</span><span class="ep-kpi-icon">'+icon(x.icon)+'</span></div><strong>'+String(x.value).padStart(2,'0')+'</strong><small>'+safe(x.hint)+'</small></article>').join('');
  }
  function decorateBadges(root){
    root.querySelectorAll('.badge').forEach(element=>{
      const label=element.textContent.trim();
      if(label==='Em missão'||label==='Em serviço') {element.classList.add('ep-status-transit');element.textContent='Em trânsito';}
      if(label==='Finalizado'||label==='Concluída') {element.classList.add('ep-status-done');element.textContent='Concluído';}
      if(label==='Aguardando saída'||label==='Aguardando entrada')element.classList.add('ep-status-pending');
      if(label==='Divergência')element.classList.add('ep-status-alert');
    });
  }
  function decorateDesktop(){
    const layout=document.querySelector('#app > .layout');
    if(!layout)return;
    const main=layout.querySelector('main');
    if(!main)return;
    document.body.classList.add('ep-enterprise');
    layout.classList.add('ep-layout');
    const stats=main.querySelector('.stats');
    if(page==='Painel'&&stats){
      stats.classList.add('ep-kpis');
      stats.innerHTML=metricMarkup(metrics());
      if(!main.querySelector('.ep-metric-note')){
        const note=document.createElement('p');note.className='ep-metric-note';
        note.textContent='* Garagem = viaturas ativas sem movimentação aberta. Indicadores limitados aos dados autorizados para seu perfil.';
        stats.after(note);
      }
      mountQuickForm(main);
    }
    decorateBadges(layout);
    main.querySelectorAll('table').forEach(table=>{
      const headers=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());
      table.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{if(!td.dataset.label)td.dataset.label=headers[i]||'Detalhe';}));
    });
  }
  function quickVehicles(mode){
    const fleet=Array.isArray(state.vehicles)?state.vehicles:[];
    const trips=Array.isArray(state.trips)?state.trips:[];
    if(mode==='return'){
      const user=state.user||{};
      const ids=new Set(trips.filter(t=>t.status==='Em serviço'&&(user.role!=='Motorista'||t.officerId===user.officerId)).map(t=>t.vehicleId));
      return fleet.filter(v=>ids.has(v.id));
    }
    const busy=new Set(trips.filter(t=>t.status!=='Concluída').map(t=>t.vehicleId));
    return fleet.filter(v=>(v.status||'Ativa')==='Ativa'&&!v.busy&&!busy.has(v.id));
  }
  function mountQuickForm(main){
    if(main.querySelector('#ep-quick'))return;
    const anchor=main.querySelector('.dashboard-grid');if(!anchor)return;
    const panel=document.createElement('section');panel.id='ep-quick';panel.className='panel ep-quick';
    panel.innerHTML='<div class="ep-quick-head"><div><span class="ep-overline">OPERAÇÃO ASSISTIDA</span><h2>Registro rápido</h2><p>Informe os dados iniciais e conclua na rotina oficial, com fotos e conferências obrigatórias.</p></div><span class="ep-quick-sign">'+icon('check')+' Fluxo validado</span></div>'+
    '<form id="ep-quick-form" class="ep-quick-grid">'+
    '<label>Operação<select name="mode"><option value="exit">Saída</option><option value="return">Retorno</option></select></label>'+
    '<label>Viatura<select name="vehicle" required></select></label>'+
    '<label class="ep-exit-only">Condutor<select name="officer"></select></label>'+
    '<label>Odômetro<input name="odometer" type="text" readonly aria-label="Odômetro de referência" placeholder="Leitura no registro oficial"></label>'+
    '<label class="ep-exit-only ep-destination">Destino / missão<input name="destination" maxlength="180" placeholder="Ex.: Serviço externo no setor norte"></label>'+
    '<div class="ep-quick-submit"><button type="submit">Continuar registro '+icon('exit')+'</button></div></form>';
    anchor.before(panel);
    const form=panel.querySelector('form');const mode=form.elements.mode,vehicles=form.elements.vehicle;
    const officers=Array.isArray(state.officers)?state.officers:[];
    form.elements.officer.innerHTML=officers.map(o=>'<option value="'+safe(o.id)+'"'+(o.id===state.user.officerId?' selected':'')+'>'+safe(o.name)+'</option>').join('');
    function update(){
      const returning=mode.value==='return';panel.classList.toggle('ep-returning',returning);
      const available=quickVehicles(mode.value);const selection=vehicles.value;
      vehicles.innerHTML='<option value="">Selecione a viatura</option>'+available.map(v=>'<option value="'+safe(v.id)+'">'+safe(v.prefix)+' · '+safe(v.plate)+'</option>').join('');
      if(available.some(v=>v.id===selection))vehicles.value=selection;
      const selected=available.find(v=>v.id===vehicles.value);
      form.elements.odometer.value=selected?.odometer==null?'Conferir na tela oficial':numberValue(selected.odometer)+' km';
      form.elements.destination.required=!returning;
      panel.querySelector('.ep-quick-submit button').innerHTML=(returning?'Continuar retorno ':'Continuar saída ')+icon(returning?'return':'exit');
      vehicles.required=true;
    }
    mode.addEventListener('change',update);
    vehicles.addEventListener('change',update);
    form.addEventListener('submit',event=>{
      event.preventDefault();const vehicleId=vehicles.value;const record=state.vehicles.find(v=>v.id===vehicleId);if(!record)return;
      if(mode.value==='return'){
        const t=state.trips.find(t=>t.vehicleId===vehicleId&&t.status==='Em serviço'&&(state.user.role!=='Motorista'||t.officerId===state.user.officerId));
        if(!t){notify('Nenhuma movimentação em serviço disponível para retorno.');return;}
        page='Movimentações';render();
        if(typeof showAction==='function')showAction(t.id,'return');
        return;
      }
      const officerId=form.elements.officer.value;
      const destination=form.elements.destination.value.trim();
      page='Movimentações';render();
      const full=document.querySelector('#departure');
      if(!full){notify('Abra a opção Solicitar saída para concluir o registro.');return;}
      const fill=(name,value)=>{const field=full.elements.namedItem(name);if(field&&value){field.value=value;field.dispatchEvent(new Event('change',{bubbles:true}));}};
      fill('vehicleId',vehicleId);fill('officerId',officerId);fill('destination',destination);
      full.scrollIntoView({behavior:'smooth',block:'start'});
      const first=full.querySelector('[name=initial]:not([readonly]),[name=firstPhoto], [name=inspectionChoice]');
      if(first)first.focus({preventScroll:true});
    });
    update();
  }
  function decorateMobile(){
    const mobile=document.querySelector('.ma-shell');if(!mobile)return;
    document.body.classList.add('ep-enterprise');
    const stage=mobile.querySelector('.ma-body'),title=mobile.querySelector('[data-ma-title]');
    if(!stage||title?.textContent?.trim()!=='Início'||stage.querySelector('.ep-mobile-kpis'))return;
    const heading=stage.querySelector('h1'),panel=document.createElement('section');
    panel.className='ep-mobile-kpis';panel.setAttribute('aria-label','Indicadores operacionais');panel.innerHTML=metricMarkup(metrics(),true);
    (heading||stage.firstElementChild).after(panel);
    const note=document.createElement('p');note.className='ep-mobile-note';note.textContent='Garagem: viaturas ativas sem saída aberta. Indicadores conforme seu perfil.';panel.after(note);
    decorateBadges(mobile);
  }
  render=function(...args){
    previousRender.apply(this,args);
    if(!state?.user||state.needsPasswordChange||state.needsDriverRegistration)return;
    try{decorateDesktop();decorateMobile();}catch(error){console.error('CEP4 Enterprise: falha de apresentação',error);}
  };
})();

  </script>
